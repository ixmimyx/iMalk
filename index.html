       خانتين بيبان لون مختلف واضح، مش مجرد ظل ناعم */
    --bg-1:color-mix(in oklab,var(--hue-lt) 30%,#000);
    --bg-2:color-mix(in oklab,var(--hue) 46%,#000);
    --bg-3:color-mix(in oklab,var(--hue) 14%,#000);
    --surface:var(--hue-lt);
    --surface-mid:color-mix(in oklab,var(--hue-lt) 55%,var(--hue));
    --surface-lo:var(--hue);
    --slot:color-mix(in oklab,var(--hue) 72%,#000);
    --slot-lo:color-mix(in oklab,var(--hue) 48%,#000);
    --hi:color-mix(in oklab,var(--hue-lt) 26%,#fff);
    --hi-2:color-mix(in oklab,var(--hue-lt) 56%,#fff);
    --mid:color-mix(in oklab,var(--hue-lt) 84%,#fff);
    /* ظل الكارت البارز: بقى شبه أسود وبكثافة 90% — فالفاصل بيبقى خط حقيقي مش شفّاف */
    --raise-dark:color-mix(in oklab,color-mix(in oklab,var(--hue) 18%,#000) 90%,transparent);
    --raise-light:color-mix(in oklab,#ffdde5 18%,transparent);
    --sink-dark:color-mix(in oklab,#000 68%,transparent);
    --drop:color-mix(in oklab,color-mix(in oklab,var(--hue) 12%,#000) 84%,transparent);
    /* حافة الكارت: لمعة أعلى-شمال أقوى شوية عشان الحد يبان حتى لو الظل خفيف */
    --rim:color-mix(in oklab,#ffe3ea 22%,transparent);
    --sheen:color-mix(in oklab,#fff 14%,transparent);
    --shine:2.4s;

    /* شريط الأيقونات: كل علامة عليها لمعة من فوق لتحت، واللي مضغوط عليها بتتنور أبيض */
    --ico-top:var(--hi);
    --ico-bottom:var(--hi-2);
    --ico-lit:#fff;
    --ico-lit-fx:drop-shadow(0 0 .55cqw color-mix(in oklab,#fff 70%,transparent));
  }

  /* الثيم التاني: لافندر */
  [data-color="lavender"]{
    --hue:#3b2f63;
    --hue-lt:#8f7bc8;
  }

  /* الثيم التالت: مينت جرين */
  [data-color="mint"]{
    --hue:#175141;
    --hue-lt:#4fae8c;
  }

  /* الثيم الرابع: أسود فحمي — مش حبري مقفل، درجة فاتحة شوية عشان الخانات تبان بارزة */
  [data-color="ink"]{
    --hue:#2f2f37;
    --hue-lt:#63636f;
    /* في الليلي الصفحة تفضل جرافيت مش أسود محبس */
    --bg-1:color-mix(in oklab,var(--hue-lt) 34%,#000);
    --bg-2:color-mix(in oklab,var(--hue) 58%,#000);
    --bg-3:color-mix(in oklab,var(--hue) 22%,#000);
    /* لمعة محايدة (بدل الوردي بتاع البرجندي) عشان الثيم رمادي */
    --raise-light:color-mix(in oklab,#e9ebf3 20%,transparent);
    --rim:color-mix(in oklab,#f2f4fa 26%,transparent);
  }

  /* الثيم الخامس: أبيض — الأسطح فضية ساطعة في الوضعين، فالحبر طبعًا غامق */
  [data-color="paper"]{
    --hue:#6b6b76;
    --hue-lt:#c9c9d3;
    --hi:#1f1f26;
    --hi-2:#3d3d46;
    --mid:#5c5c67;
    /* في الليلي الصفحة جرافيت مش سودا، عشان الفضة تفضل محسوبة على إنها ثيم أبيض */
    --bg-1:color-mix(in oklab,var(--hue-lt) 34%,#000);
    --bg-2:color-mix(in oklab,var(--hue) 62%,#000);
    --bg-3:color-mix(in oklab,var(--hue) 30%,#000);
    /* الحواجز والحواف رمادي بارد بدل الوردي */
    --raise-light:color-mix(in oklab,#fff 30%,transparent);
    --raise-dark:color-mix(in oklab,#101014 78%,transparent);
    --drop:color-mix(in oklab,#0c0c10 76%,transparent);
    --rim:color-mix(in oklab,#fff 40%,transparent);
    --sink-dark:color-mix(in oklab,#000 48%,transparent);
    /* الأيقونات تبقى غامقة على الفضة */
    --ico-top:#2a2a32;
    --ico-bottom:#4a4a55;
    --ico-lit:#fff;
  }

  /* الثيم الأبيض في الوضع الفاتح: الصفحة كلها ورق، فالفاصل رمادي والظل رمادي مش أسود */
  [data-color="paper"][data-mode="light"]{
    --bg-1:color-mix(in oklab,var(--hue) 22%,#fff);
    --bg-2:color-mix(in oklab,var(--hue) 34%,#eae8ee);
    --bg-3:color-mix(in oklab,var(--hue) 48%,#dcd8e0);
    --hi:#22222a;
    --hi-2:#55555f;
    --mid:#6f6f7b;
    --raise-dark:color-mix(in oklab,#5c5c68 52%,transparent);
    --raise-light:color-mix(in oklab,#fff 86%,transparent);
    --drop:color-mix(in oklab,#5c5c68 46%,transparent);
    --sink-dark:color-mix(in oklab,#5b5b66 34%,transparent);
    --rim:color-mix(in oklab,#fff 78%,transparent);
    --ico-top:#2f2f38;
    --ico-bottom:#4e4e59;
    --ico-lit-fx:drop-shadow(0 .16cqw .22cqw color-mix(in oklab,#4c4c58 55%,transparent));
  }

  /* الوضع الفاتح: الخلفية تبقى رمادية ملوّنة أغمق شوية والكروت تفضل ساطعة،
     فالفواصل تبان وهي نفسها من غير ما التصميم الفاتح يتبوظ */
  [data-mode="light"]{
    --bg-1:color-mix(in oklab,var(--hue) 17%,#fff);
    --bg-2:color-mix(in oklab,var(--hue) 29%,#ece6ee);
    --bg-3:color-mix(in oklab,var(--hue) 42%,#ddd5e0);
    --surface:color-mix(in oklab,var(--hue) 6%,#fff);
    --surface-mid:color-mix(in oklab,var(--hue) 12%,#f7f4f7);
    --surface-lo:color-mix(in oklab,var(--hue) 20%,#eae4ea);
    --slot:color-mix(in oklab,var(--hue) 32%,#e6dfe4);
    --slot-lo:color-mix(in oklab,var(--hue) 44%,#dcd4da);
    --hi:color-mix(in oklab,var(--hue-lt) 45%,#000);
    --hi-2:color-mix(in oklab,var(--hue-lt) 72%,#000);
    --mid:color-mix(in oklab,var(--hue-lt) 92%,#000);
    /* ظل أغمق وأضيق شوية: بيسيب في الفاصل خط رمادي صريح بدل ما يذوب فيه */
    --raise-dark:color-mix(in oklab,var(--hue) 48%,transparent);
    --raise-light:color-mix(in oklab,#fff 80%,transparent);
    --sink-dark:color-mix(in oklab,var(--hue) 32%,transparent);
    --drop:color-mix(in oklab,var(--hue) 42%,transparent);
    --rim:color-mix(in oklab,#fff 82%,transparent);
    --sheen:color-mix(in oklab,#fff 60%,transparent);
    /* على السطح الفاتح: البياض بيتقرأ بظل غامق وراه مش بهالة */
    --ico-lit-fx:drop-shadow(0 .16cqw .22cqw color-mix(in oklab,var(--hue) 60%,transparent));
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100dvh;
    /* خط بناتي: Dancing Script — لو النت مقفول بيروح على خط الويندوز المكتوب باليد */
    font-family:'Dancing Script','Segoe Script','Bradley Hand',cursive;
    letter-spacing:.015em;
    display:grid;
    place-items:center;
    padding:2.2vmin;
    background:
      radial-gradient(120% 90% at 50% 0%,var(--bg-1) 0%,var(--bg-2) 62%,var(--bg-3) 100%);
  }

  .raise{
    background:linear-gradient(155deg,var(--surface) 0%,var(--surface-mid) 48%,var(--surface-lo) 100%);
    /* الظل الفاتح متضيّق شوية عشان هالته ما تملاش الفاصل بين الكروت */
    box-shadow:
      -.7cqw -.7cqw 1.2cqw var(--raise-light),
      .9cqw .9cqw 2.2cqw var(--raise-dark),
      inset .1cqw .1cqw .1cqw var(--rim);
  }

  .sink{
    background:linear-gradient(155deg,var(--slot) 0%,var(--slot-lo) 100%);
    box-shadow:
      inset .5cqw .5cqw 1.1cqw var(--sink-dark),
      inset -.4cqw -.4cqw .9cqw var(--rim);
  }

  /* ===== 0) CONTAINER: كل القياسات جوه هنا ===== */
  .frame{
    position:relative;
    width:min(96vw, calc(96dvh * 1.02), 1040px);
    aspect-ratio:1.0235/1;
    container-type:inline-size;
  }

  /* ===== 1) FRAME: شبكة بس، من غير خلفية مشتركة ===== */
  .stage{
    width:100%;height:100%;
    --gap:2.6cqw;
    --r-lg:2.6cqw;
    --r-md:1.8cqw;
    --r-sm:1.2cqw;
    /* سكتة الموشن الخفيف عند الوقوف على حاجة */
    --motion:.22s;
    --ease:cubic-bezier(.34,1.34,.64,1);
    padding:var(--gap);
    display:grid;
    grid-template-columns:8.9cqw minmax(0,1fr) 21.6cqw;
    grid-template-rows:8.9cqw minmax(0,1fr);
    grid-template-areas:"topbar topbar topbar" "rail core side";
    gap:var(--gap);
  }

  /* ===== 1-أ) TOP ROW: الوقت والتاريخ قد عرض الصورة، والثيم والمود على اليمين ===== */
  .topbar{
    grid-area:topbar;
    /* نفس أعمدة الشبكة اللي تحت بالظبط: العمود التاني = عرض الصورة، والتالت = عرض العمود الأيمن */
    display:grid;
    grid-template-columns:8.9cqw minmax(0,1fr) 21.6cqw;
    gap:var(--gap);
  }
  .topbar__fields{
    grid-column:2;
    /* التلات خانات قد بعض بالظبط في العرض، وبيشدوا لارتفاع صورة البروفايل، ومحاذيين للصورة الكبيرة اللي تحت */
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);
    gap:var(--gap);
  }
  .topbar__switches{
    grid-column:3;
    display:flex;justify-content:space-between;
  }
  .pill{
    /* أسطوانة زي ما كانت: أيقونة وكلمة في سطر واحد ومتوسطين */
    border:0;border-radius:999px;
    display:flex;align-items:center;justify-content:center;gap:1.1cqw;
    padding:0 1.6cqw;min-width:0;color:var(--hi);
  }
  .dot{
    /* دايرة كاملة: عرضها = ارتفاع سطر فوق بالظبط (8.9) — الاتنين مع بعض 21.6 زي عرض العمود الأيمن */
    width:8.9cqw;height:8.9cqw;
    border:0;border-radius:50%;
    display:grid;place-items:center;color:var(--hi-2);cursor:pointer;
  }
  .dot.is-on{
    background:linear-gradient(155deg,var(--slot) 0%,var(--slot-lo) 100%);color:var(--hi);
    box-shadow:
      inset .5cqw .5cqw 1.1cqw var(--sink-dark),
      inset -.4cqw -.4cqw .9cqw var(--rim);
  }
  /* زرار المود لوحده: فحمي فاتح (ليلي) / أبيض (نهار) — بارزة مش غائرة، ومن غير أي لون من الثيم */
  .dot--night,.dot--night.is-on{
    box-shadow:
      -.7cqw -.7cqw 1.5cqw rgba(255,255,255,.42),
      .9cqw .9cqw 2.2cqw rgba(0,0,0,.46),
      inset .1cqw .1cqw .1cqw rgba(255,255,255,.55);
  }
  .dot--night{
    background:linear-gradient(155deg,var(--mode-paper) 0%,var(--mode-paper-lo) 100%);
    color:var(--mode-ink-lo);
  }
  .dot--night.is-on{
    background:linear-gradient(155deg,var(--mode-ink) 0%,var(--mode-ink-lo) 100%);
    color:var(--mode-paper);
  }
  /* القمر في الوضع الليلي، والشمس في الوضع النهاري */
  .dot--night .icon--sun{display:none}
  .dot--night:not(.is-on) .icon--sun{display:block}
  .dot--night:not(.is-on) .icon--moon{display:none}
  .dot svg{
    width:3.1cqw;height:3.1cqw;flex:none;
    fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  }
  /* أيقونات الوقت والتاريخ أصغر نص شعرة عشان مع الخانة الصغيرة ميغلوش الحرف */
  .pill svg{
    width:2.6cqw;height:2.6cqw;flex:none;
    fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  }
  /* الوقت والتاريخ الحقيقيين: الرقم بيتوسط مكانه عشان الخط البناتي أحرفه مش قد بعض والثابت ميحرّكش الأيقونة */
  .pill__text{
    flex:1;text-align:center;
    font-size:1.8cqw;line-height:1;font-weight:700;
    letter-spacing:.03cqw;color:var(--hi);
    white-space:nowrap;
  }
  /* ===== 1-ب) خانة الاسم: أسطوانة قد الوقت والتاريخ بالظبط، وفيها اسم Malk بس وبخط كبير ===== */
  .who{
    position:relative;z-index:3;
    border-radius:999px;
    padding:0 1.6cqw;min-width:0;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
  }
  /* الاسم: هو الكبير لوحده في نص الخانة */
  .who__name{
    flex:none;
    font-size:3.9cqw;line-height:1;font-weight:700;letter-spacing:.02cqw;
    color:var(--hi);white-space:nowrap;
  }

  /* ===== 2) LEFT RAIL: اتقسم نصين اسطوانيين — فوق للتنقل وتحت للسوشيال ===== */
  .rail{grid-area:rail;display:grid;grid-template-rows:3fr 5fr;gap:var(--gap)}

  /* دايرة البروفايل الكبيرة جنب الوقت: بنفس عرض العمود الشمال (8.9) ومحاذاتة للبار اللي تحته */
  .topbar__avatar{
    grid-column:1;
    position:relative;
    border-radius:50%;overflow:hidden;
    display:grid;place-items:center;color:var(--hi);
  }
  .topbar__avatar svg{width:5cqw;height:5cqw}
  /* الصورة في الدايرة: 200% auto = تقريب للصورة (مش المشهد كله)، و70% 22% = موضع
     التقريب على راسها هي بالظبط — لو بدّلت صورة تانية رجّعها 50% 50%/cover */
  .topbar__avatar-photo{position:absolute;inset:0;z-index:1;background:var(--avatar) 70% 22%/200% auto no-repeat}

  /* كل نصين اسطوانة لوحدها، والأيقونات متوزية جواها */
  .rail__grp{
    border-radius:999px;
    padding:2cqw 0;
    display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
    gap:1.2cqw;min-height:0;
  }
  .rail__btn{
    flex:none;
    width:4.6cqw;height:4.6cqw;border:0;border-radius:50%;
    display:grid;place-items:center;
    color:var(--hi-2);background:none;text-decoration:none;cursor:pointer;
  }
  /* كل علامة محصورة على مساحتها المرسومة، فالأحجام بيبان متساوي من غير تحجيل per-icon */
  .rail__btn svg{
    width:3.5cqw;height:3.5cqw;
    fill:url(#ico-sheen);stroke:none;
  }
  /* علامات الشركات أعرض وأكثف من أيقونات التنقل — بنصغرها نص شعرة تفضل بنفس الوضوح */
  .rail__btn--brand svg{width:3.25cqw;height:3.25cqw}
  /* الصفحة المضغوطة: من غير أي دايرة — العلامة نفسها بتنور أبيض وراها هالة */
  .rail__btn.is-active{
    background:none;box-shadow:none;color:var(--ico-lit);
  }
  .rail__btn.is-active svg{fill:var(--ico-lit);filter:var(--ico-lit-fx)}

  /* ===== 3) CORE: الصورة كتلة واحدة نازلة لآخر العمود ===== */
  .core{grid-area:core;position:relative;min-height:0}

  .media{
    position:absolute;inset:0;
    clip-path:url(#media-cut);
    overflow:hidden;
    display:grid;place-items:center;
    min-height:0;
  }
  .media::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 38%,var(--sheen) 50%,transparent 62%);
    transform:translateX(-100%);
  }
  .media:hover::after{animation:shine var(--shine) ease-in-out infinite}
  @keyframes shine{to{transform:translateX(100%)}}

  .media__glyph{width:6.2cqw;height:6.2cqw;color:var(--hi);opacity:.9}

  /* الصورة الكبيرة: بتاخد نفس الصورة المتخزنة في --malk، وبتتقص من الجنابين شعرة
     بس لأن نسبة الخانة (59×81) شبه نسبة الصورة نفسها — فالبارزة فوقها تفضل كاملة.
     z-index:1 = الصورة بتغطي علامة الصور الرمادية، فالعلامة متبانش على صورة محطوطة */
  .media__photo{position:absolute;inset:0;z-index:1;background:var(--malk) 50% 50%/cover no-repeat}

  /* ===== 3-ب) الجاليري: أربع صور في عمودين وسطرين، والخامسة دايرة في نصهم ===== */
  /* السطر التالت 32% = بالظبط ارتفاع مشغلة الصوت اللي تحت، وبقّت ممدودة عرض الصفحة كله */
  .gallery{
    --d:22cqw;
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:1fr 56%;
    grid-template-rows:1fr 1fr 32%;
    gap:var(--gap);
  }
  .tile{
    position:relative;overflow:hidden;
    border-radius:var(--r-lg);
    display:grid;place-items:center;color:var(--hi);
  }
  .tile__glyph{width:4.2cqw;height:4.2cqw;opacity:.85}
  /* صورته: الصورة بتتختار من قايمة --p1..--p5 فوق (سطر واحد لكل صورة). z-index:1 بيخلي
     الصورة تغطي علامة الصور الرمادية — فالعلامة بتفضل باينة بس في الخانة الفاضية */
  .tile__img{position:absolute;inset:0;z-index:1;background:50% 30%/cover no-repeat}
  /* الدايرة الخامسة: كولاج — قاعدة في نص الأربع صور، والقص بيتم في صور الأربع نفسهم
     (مش في الخانات) فالظل حوالين كل خانة بيفضل زي ما هو. مركز الدائرة = الركن بتاع كل
     خانة الباصص على النص + نص الفاصل، و --cut = راديوس الدايرة + الفاصل الدائري، فالصور
     الأربعة بتقطع حوالين الصورة الدائرية من غير أي إطار عليها. transform-origin على نفس
     الركن عشان تكبير الصورة مع الماوس ما يحرّش القص من مكانه.
     عايز الدايرة أكبر أو أصغر: عدّل --d فوق بس، والقص بيلحقها لوحده */
  .gallery .tile:not(.gallery__center) .tile__img{
    --cut:calc(var(--d) / 2 + 1.3cqw);
    -webkit-mask:radial-gradient(circle var(--cut) at var(--mx) var(--my),transparent calc(var(--cut) - .2cqw),#000 var(--cut));
            mask:radial-gradient(circle var(--cut) at var(--mx) var(--my),transparent calc(var(--cut) - .2cqw),#000 var(--cut));
  }
  .gallery .tile:nth-child(1) .tile__img{--mx:calc(100% + var(--gap) / 2);--my:calc(100% + var(--gap) / 2);transform-origin:bottom right}
  .gallery .tile:nth-child(2) .tile__img{--mx:calc(var(--gap) / -2);--my:calc(100% + var(--gap) / 2);transform-origin:bottom left}
  .gallery .tile:nth-child(3) .tile__img{--mx:calc(100% + var(--gap) / 2);--my:calc(var(--gap) / -2);transform-origin:top right}
  .gallery .tile:nth-child(4) .tile__img{--mx:calc(var(--gap) / -2);--my:calc(var(--gap) / -2);transform-origin:top left}
  /* الدايرة نفسها: مركزها نقطة تلاقي السطرين والعمودين (44% حد العمودين، 34% حد السطرين)
     — محسوب من مقاسات الجاليري. من غير أي إطار: الصورة الدائرية بتبان كاملة، والفاصل
     الدائري حوالينها عمله القص اللي في صور الأربع. نفس كلاس tile = نفس الضغط وبيانات الصورة */
  .gallery__center{
    position:absolute;
    left:calc(44% - var(--gap)/2);top:calc(34% - var(--gap)/2);
    margin-left:calc(var(--d) / -2);margin-top:calc(var(--d) / -2);
    width:var(--d);height:var(--d);border-radius:50%;
  }

  /* ===== 4) MP3 PLAYER: نفس المستطيل تحت الصورة (مكانه وحجمه ما اتغيروش) ===== */
  .lines{
    position:absolute;right:0;bottom:0;
    width:56%;height:32%;
    border-radius:var(--r-lg);
    padding:1.6cqw;
    display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;
    gap:var(--gap);
    box-shadow:
      -1.2cqw -1.2cqw 2.4cqw var(--raise-light),
      1.6cqw 1.6cqw 3.4cqw var(--drop);
  }
  /* في صفحة الأصدقاء وفي الجاليري مفيش خانة فاضية تحت على الشمال، فمكانها بيتقفل:
     المشغل بيخد عرض الصفحة كامل — نفس الارتفاع ونفس الحافة التحت-يمين، بس ممدود على الشمال */
  html[data-view="friends"] .lines,
  html[data-view="gallery"] .lines{width:100%}

  /* ===== 4-ب) إطار ساوند كلاود: أغاني ساوند كلاود مفيش منها لينك ملف مباشر،
     فالتشغيل بيتم من المشغل الرسمي بتاعهم في إطار واحد بكسل مستخبي ورا المستطيل —
     مفيش منه أي حاجة باينة على الصفحة، والأزرار بتاعتك (تشغيل/إيقاف/شريط التقدم/
     الأوقات) هي اللي بتحكمه. أي سطر في SONGS لينكه يبدأ بـ soundcloud.com بيتم التعرف
     عليه أوتوماتيك من غير أي كلاس زيادة ===== */
  .sc-frame{
    position:absolute;left:0;bottom:0;
    width:1px;height:1px;border:0;opacity:0;pointer-events:none;
  }

  /* السطر الأول: غلاف صغير + سطر العنوان والفنان + زرار التشغيل */
  .lines__head{display:flex;align-items:center;gap:1.4cqw}
  .lines__art{
    flex:none;width:5.6cqw;height:5.6cqw;border-radius:1.7cqw;
    display:grid;place-items:center;color:var(--hi);
  }
  .lines__art svg{
    width:2.9cqw;height:2.9cqw;
    fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  }
  .lines__text{flex:1;min-width:0;display:grid;gap:.9cqw;justify-items:start}
  .lines__title{width:80%;height:1.1cqw;border-radius:.55cqw;background:var(--hi)}
  .lines__sub{width:52%;height:.9cqw;border-radius:.45cqw;background:var(--hi-2);opacity:.6}
  .lines__play{
    flex:none;width:5.6cqw;height:5.6cqw;border:0;border-radius:50%;
    background:var(--hi);color:var(--surface-lo);
    box-shadow:.3cqw .3cqw .8cqw var(--drop);
    display:grid;place-items:center;cursor:pointer;
  }
  .lines__play svg{width:2.6cqw;height:2.6cqw}
  .lines__play .icon--pause{display:none}
  .lines__play.is-playing .icon--pause{display:block}
  .lines__play.is-playing .icon--play{display:none}
  /* التجمع يمين السطر الأول: أغنية قبلية / تشغيل / أغنية بعدية */
  .lines__ctrl{flex:none;display:flex;align-items:center;gap:.9cqw}
  .lines__step{
    flex:none;width:3.4cqw;height:3.4cqw;border:0;border-radius:50%;
    background:none;color:var(--hi-2);
    display:grid;place-items:center;cursor:pointer;
  }
  .lines__step svg{width:2.2cqw;height:2.2cqw}

  /* الموجة: 12 عمود — ثابتة على النِسب دي، والـ EQ بيبدّلها بطول حقيقي من الصوت */
  .lines__wave{display:flex;align-items:flex-end;gap:.45cqw;min-height:0}
  .lines__wave i{flex:1;height:var(--h,48%);border-radius:.4cqw;background:var(--mid);opacity:.4}
  .lines__wave i:nth-child(6n+1){--h:48%}
  .lines__wave i:nth-child(6n+2){--h:86%}
  .lines__wave i:nth-child(6n+3){--h:36%}
  .lines__wave i:nth-child(6n+4){--h:72%}
  .lines__wave i:nth-child(6n+5){--h:100%}
  .lines__wave i:nth-child(6n+6){--h:60%}

  /* شريط التقدم: ضغطة واحدة تقفّك في أي مكان */
  .lines__bar{
    position:relative;height:1.2cqw;border-radius:999px;cursor:pointer;
  }
  .lines__fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    border-radius:999px;background:var(--hi);
  }
  .lines__knob{
    position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);
    width:2.3cqw;height:2.3cqw;border-radius:50%;background:var(--hi);
    box-shadow:.25cqw .25cqw .7cqw var(--drop);
  }

  /* الوقت: الحالي على الشمال والإجمالي على اليمين */
  .lines__time{display:flex;justify-content:space-between;font-size:1.65cqw;line-height:1;font-weight:600;color:var(--hi-2)}
  .lines__time .t-tot{color:var(--mid)}

  /* ===== 5) RIGHT COLUMN ===== */
  .side{grid-area:side;position:relative;display:flex;flex-direction:column;gap:2.2cqw;min-height:0}

  /* ===== 5-ج) خانة Photo: تحت دايرة المود على اليمين — بتفتح صفحة المعرض ===== */
  .gallery-jump{
    flex:none;height:4.4cqw;border:0;cursor:pointer;font:inherit;
    display:flex;align-items:center;justify-content:center;
    border-radius:999px;padding:0 1.6cqw;
    font-size:2.25cqw;line-height:1;font-weight:700;letter-spacing:.03cqw;color:var(--hi);
  }
  /* الخانة دي ثابتة في الصفحات التلاتة — لوختفت في صفحة تانية الكروت كانت
     بتكبر شوية في الصفحة دي وتصغر في الرئيسية، فالشكل مبقاش ثابت */

  /* 5 كروت: واحد في النص + اتنين طالعين فوقه + اتنين تحته (coverflow راسي).
     الضغط على أي كارت ينقله للنص، وباقي الكروت يلفوا محله — النص يفضل في نصه */
  .stack{
    position:relative;
    flex:1.5 1 0;min-height:0;
    border-radius:var(--r-md);
  }
  .stack__item{
    /* كل الكروت متوسطة راسياً بنفس الـ transform، والمكان بيتحدد بـ top */
    position:absolute;left:0;right:0;top:50%;height:44%;
    transform:translateY(-50%);
    border:0;cursor:pointer;
    border-radius:var(--r-sm);
    background:linear-gradient(150deg,var(--surface-mid),var(--surface-lo));
    box-shadow:0 -.35cqw 1cqw var(--drop);
    transition:top .55s cubic-bezier(.4,0,.2,1),height .55s cubic-bezier(.4,0,.2,1),
               left .55s cubic-bezier(.4,0,.2,1),right .55s cubic-bezier(.4,0,.2,1),
               opacity .55s ease,transform var(--motion) var(--ease);
  }
  /* النص: أعرض كارت وأمامهم كله */
  .stack__item.pos-mid{
    top:50%;height:44%;left:0;right:0;z-index:5;opacity:1;
    background:linear-gradient(150deg,var(--hi),var(--hi-2));
    box-shadow:.3cqw .3cqw 1.1cqw var(--drop), inset .15cqw .15cqw .4cqw var(--rim);
  }
  /* اللي فوق والنزل القريبين: أصغر شوية وداخل من الجنابين */
  .stack__item.pos-up1,.stack__item.pos-dn1{
    height:34%;left:6%;right:6%;z-index:4;opacity:.85;
    background:linear-gradient(150deg,var(--surface),var(--surface-mid));
  }
  .stack__item.pos-up1{top:21%}
  .stack__item.pos-dn1{top:79%}
  /* البعيدين فوق وتحت: أصغر كارتين، داخلين من الجنابين وبيطلّعوا شعرة من حافة الكروت */
  .stack__item.pos-up2,.stack__item.pos-dn2{
    height:26%;left:12%;right:12%;z-index:3;opacity:.6;
    background:linear-gradient(150deg,var(--surface-mid),var(--surface-lo));
  }
  .stack__item.pos-up2{top:11.3%}
  .stack__item.pos-dn2{top:88.7%}
  .stack__knob{
    position:absolute;left:.9cqw;top:1.1cqw;
    width:1.25cqw;height:2.1cqw;border-radius:.7cqw;
    background:var(--hi-2);
    box-shadow:inset .1cqw .1cqw .2cqw var(--sink-dark);
  }
  .pos-mid .stack__knob{background:var(--slot)}
  /* صورة الكارت: بتاخد الصورة المكتوبة في السطر بتاعه (--p1..--p5)، ولو none
     التدرج اللي تحتها بيبان زي ما كان — والبروز الصغير فوق-شمال بيفضل فوق الصورة */
  .stack__img{position:absolute;inset:0;border-radius:inherit;background:50% 30%/cover no-repeat}

  /* ===== 5-ب) SONGS: خانات الأغاني — أسطوانات زي خانة الوقت والتاريخ بالظبط، ومن غير أي مستطيل حولهم ===== */
  /* الخانات بتعمل نفسها من قايمة SONGS اللي في السكربت — حط لينك الأغنية هناك وهي بتظهر هنا */
  /* الكتلة دي بتاخد نفس ارتفاع مستطيل المشغل (32٪) فبتقف شابكاه من فوق ومن تحت */
  .songs{
    flex:none;height:32%;min-height:0;
    display:flex;flex-direction:column;gap:1cqw;
  }
  /* كل أغنية = نفس زرار الوقت والتاريخ (بنفس كلاس pill) — الفرق إنه أطول على عرض العمود */
  .track{
    flex:1 1 0;min-height:0;font:inherit;cursor:pointer;
  }
  /* العلامة على الشمال: نفس مكان أيقونة الوقت، بس أصغر شوية عشان الخانة أرفع */
  .track svg{width:2.2cqw;height:2.2cqw;flex:none;fill:url(#ico-sheen);stroke:none}
  /* الاسم: بياخد باقي الخانة ومتوسّط زي رقم الوقت بالظبط.
     unicode-bidi:plaintext = اتجاه السطر بيتحدد من أول حرف فيه، فالعربي يترتب صح */
  .track .pill__text{overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
  /* الاسم أطول من الخانة؟ بيتمشي جواها على الشمال لحد ما يورّي آخره، وبيقف شوية
     في كل ناحية ويرجع — والمقدار ده بيتحسب نسبة لعرض الخانة نفسها في السكربت،
     فالحركة تفضل نفس المسافة على أي مقاس شاشة */
  @keyframes marquee{
    0%, 14%{transform:translateX(0)}
    86%, 100%{transform:translateX(var(--shift, 0%))}
  }
  .track.is-long .pill__text{
    text-align:left;text-overflow:clip;
    animation:marquee 9s ease-in-out infinite alternate;
  }
  /* الأغنية اللي شغالة: الخانة بتندرج جوا (غائرة) زي دايرة المود وهي مشغولة */
  .track.is-active{
    background:linear-gradient(155deg,var(--slot) 0%,var(--slot-lo) 100%);
    box-shadow:
      inset .5cqw .5cqw 1.1cqw var(--sink-dark),
      inset -.4cqw -.4cqw .9cqw var(--rim);
  }

  /* ===== 5-أ) FRIENDS: أسطوانات زي خانات الأغاني بالظبط — خمس سطور فوق بعض في نص الصفحة ===== */
  /* الكتلة دي بتاخد عرض الصورة الكبير كله وبتوقف قبل مشغل الصوت بفاقة، فالسطور محاذية
     من الجنابين ومن فوق، والمشغل بيفضل في مكانه تحتهم من غير أي تداخل */
  .friends{
    position:absolute;inset:0 0 calc(32% + var(--gap)) 0;
    display:flex;flex-direction:column;gap:1cqw;min-height:0;
  }
  /* كل صديق = نفس أسطوانة الأغنية (كلاس pill) — صورة مدورة على الشمال، جنبها الاسم
     على الشمال كمان، ويوزر xات والـ ID مع بعض مدفوعين على آخر الخانة على اليمين */
  .friend{
    flex:1 1 0;min-height:0;
    justify-content:flex-start;gap:1.3cqw;padding:0 1.2cqw;
  }
  .friend__avatar{
    position:relative;flex:none;overflow:hidden;
    width:7.4cqw;height:7.4cqw;border-radius:50%;
    display:grid;place-items:center;color:var(--hi);
  }
  .friend__avatar svg{width:4cqw;height:4cqw}
  .friend__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .friend__avatar img:not([src]){display:none}
  /* الاسم غامق وشوية أكبر على الشمال، واليوزر والـ ID فاتتين وملازمين بعض على اليمين */
  .friend__name{
    flex:none;font-size:2.2cqw;line-height:1;font-weight:700;color:var(--hi);white-space:nowrap;
  }
  .friend__user{
    flex:none;margin-left:auto;font-size:2cqw;line-height:1;font-weight:600;color:var(--hi-2);white-space:nowrap;
  }
  .friend__id{
    flex:none;font-size:2cqw;line-height:1;font-weight:600;color:var(--hi-2);opacity:.8;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }

  /* ===== 6) MOTION: موشن خفيف عند الوقوف على أي زرار أو سكشن — الصفحة تفضل حيّة ===== */
  /* كل الحرك نسبة وسكتة (٪ و scale) — كروم مش بتقدر تنقّل بين قيم cqw جوه transition */
  .raise,.sink,.pill,.dot,.rail__btn,.lines__play,.lines__step,.lines__bar,.lines__knob,
  .lines__wave i,.tile__img,.tile__glyph,.friend__avatar,.friend__name,.friend__user,.zoom__btn{
    transition:transform var(--motion) var(--ease),opacity var(--motion) ease,filter var(--motion) ease,background var(--motion) ease,box-shadow var(--motion) ease;
  }
  /* الكروت: حركتها كلها متعرف في مكانها فوق (top/height/opacity) — سكتة الوقوف بتاعتها جوا نفس القاعدة */

  @media (hover:hover){
    /* السكشنات الكبيرة: بترتفع شعرة واحدة بس، من غير ما تغيير مكانها */
    .media:hover,.lines:hover,.friend:hover,.tile:hover,
    .pill:hover,.who:hover,.topbar__avatar:hover{transform:translateY(-.5%) scale(1.007)}

    /* الأزرار الدايرة: بتندرج جوا شوية، والضغطه بتدخلها أكتر */
    .dot:hover,.rail__btn:hover{transform:scale(.9)}
    .dot:active,.rail__btn:active{transform:scale(.82)}

    /* خانة Photo: بتكبر شوية وهي واقفة فوقها، وبتنده للقبل مع الضغط */
    .gallery-jump:hover{transform:scale(1.03)}
    .gallery-jump:active{transform:scale(.97)}

    /* زرار التشغيل وأزرار الأغاني: بيكبروا شوية */
    .lines__play:hover{transform:scale(1.09)}
    .lines__play:active{transform:scale(.94)}
    .lines__step:hover{transform:scale(1.18)}
    .lines__step:active{transform:scale(.9)}
    .lines__art:hover{transform:scale(1.06)}

    /* شريط التقدم: بيرتفع وعقربته بتكبر عشان تحس إنه ماسك حاجة */
    .lines__bar:hover{transform:scaleY(1.35)}
    .lines__bar:hover .lines__knob{transform:translate(-50%,-50%) scale(1.25)}

    /* الأعمدة: بتفوق شوية لما تقف فوق المشغل */
    .lines:hover .lines__wave i{opacity:.62}

    /* الكروت المتراكبة: اللي واقف عليه بيميل للكبر شوية من مكانه */
    .stack__item:hover{transform:translateY(-50%) scale(1.04)}

    /* الجاليري: صورته بتعمل زووم خفيف وعلامته بتطالع */
    .tile:hover .tile__img{transform:scale(1.06)}
    .tile:hover .tile__glyph{transform:scale(1.1)}

    /* سطر الصديق: صورته بتكبر واسمه ويوزره بيتقدّموا شوية */
    .friend:hover .friend__avatar{transform:scale(1.07)}
    .friend:hover .friend__name,.friend:hover .friend__user{transform:translateX(2.5%)}

    /* خانات الأغاني بتاخد حركة الوقوف نفسها من كلاس pill، فالسطور دي كانت بتزود زحمة — اتشالت */

    /* أزرار الصورة الكبيرة: بتنده جوا زي باقي الأزرار الدايرة */
    .zoom__btn:hover{transform:scale(.92)}
    .zoom__btn:active{transform:scale(.84)}
  }

  /* ===== 7) VIEWS: الطبقات بتبان وتخفى من نفس الصفحة ===== */
  /* الحركة بنسبة مش بـ cqw: كروم مش بتقدر تنقّل بين قيم cqw جوه transition */
  .layer{transition:opacity .4s ease, transform .26s cubic-bezier(.34,1.34,.64,1)}
  .layer.is-hidden{opacity:0;transform:scale(.94);pointer-events:none}

  /* ===== 8) SNOW: طبقة الثلج فوق الإطارة كلها — بتتسحب ورا مقاس الإطارة ===== */
  .snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  /* ===== 9) الصورة الكبيرة: بتفتح لما تدوس على خانة في المعرض، أو على الصورة
     الكبيرة نفسها، أو على دايرة البروفايل فوق (دي بتفتح الكروت) ===== */
  .zoom{
    position:absolute;inset:0;z-index:6;
    display:grid;place-items:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .zoom.is-open{opacity:1;pointer-events:auto}
  /* الخلفية ورا الصورة بتغمق — نفس لون الخلفية بس بكثافة، فالصورة تبان وحدها */
  .zoom__bg{position:absolute;inset:0;background:var(--bg-3);opacity:.92}
  /* مقاس الصورة الكبيرة: 46×64 = نفس نسبة الصور اللي عندك، فالتقص يكون أقل ما يمكن */
  .zoom__box{
    position:relative;
    width:46cqw;height:64cqw;
    border-radius:var(--r-lg);
    overflow:hidden;
    display:grid;place-items:center;
    transform:scale(.92);
    transition:transform .3s var(--ease);
  }
  .zoom.is-open .zoom__box{transform:scale(1)}
  /* الصورة: بتاخد نفس المتخزين في --p1..--p5، والعلامة الرمادية بتفضل وراها */
  .zoom__img{position:absolute;inset:0;z-index:1;background:50% 30%/cover no-repeat}
  .zoom__glyph{width:7cqw;height:7cqw;color:var(--hi);opacity:.85}
  /* أزرار دايرة: قبل/بعد على الجنابين، والقفل فوق على اليمين */
  .zoom__btn{
    position:absolute;
    width:6.4cqw;height:6.4cqw;border:0;border-radius:50%;
    display:grid;place-items:center;
    color:var(--hi);cursor:pointer;
  }
  .zoom__btn svg{
    width:2.8cqw;height:2.8cqw;
    fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  }
  .zoom__btn--prev{left:4cqw;top:50%;margin-top:-3.2cqw}
  .zoom__btn--next{right:4cqw;top:50%;margin-top:-3.2cqw}
  .zoom__btn--close{right:4cqw;top:4cqw}

  /* الأماكن اللي بتفتح الصورة الكبيرة: السهم يبان عليها */
  .tile,.media,.topbar__avatar{cursor:pointer}
  /* المسطرة (الأعمدة): بتتشغل وتقف بالضغط عليها */
  .lines__wave{cursor:pointer}
</style>
</head>
<body>

  <!-- 3-أ) قطع الصورة: أطراف القطع مدوّرة زي المستطيل الصغير (1.6cqw) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="media-cut" clipPathUnits="objectBoundingBox">
        <path d="M0.044 0 L0.956 0 A0.044 0.032 0 0 1 1 0.032
                 L1 0.628 A0.027 0.020 0 0 1 0.973 0.648
                 L0.440 0.648 A0.044 0.032 0 0 0 0.396 0.680
                 L0.396 0.980 A0.027 0.020 0 0 1 0.369 1
                 L0.044 1 A0.044 0.032 0 0 1 0 0.968
                 L0 0.032 A0.044 0.032 0 0 1 0.044 0 Z"/>
      </clipPath>
    </defs>
    <!-- لمعة العلامات: تدرّج واحد وكل أيقونة بياخد على مسحها الخاص -->
    <linearGradient id="ico-sheen" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="var(--ico-top)"/>

    <!-- 5) العمود الأيمن: خانة Photo، ووراها 5 كروت (واحد في النص و اتنين فوق و اتنين تحت)، وقايمة الأغاني تحت — التلاتة ثابتيين في كل الصفحات -->
    <aside class="side">
      <!-- خانة Photo: تحت دايرة المود، بتفتح صفحة المعرض اللي على الشمال -->
      <button class="gallery-jump raise" type="button">Photo</button>

      <!-- الكروت: الكلاست بتحدد مكانها — pos-mid في النص، pos-up1/2 فوق، pos-dn1/2 تحت.
           صورة كل كارت: السطر بتاع --p في الأعلى، والخامسة لسه فاضية (none) -->
      <div class="stack layer" id="deck">
        <button class="stack__item pos-mid" type="button"><i class="stack__img" style="background-image:var(--p1)"></i><i class="stack__knob"></i></button>
        <button class="stack__item pos-dn1" type="button"><i class="stack__img" style="background-image:var(--p2)"></i><i class="stack__knob"></i></button>
        <button class="stack__item pos-dn2" type="button"><i class="stack__img" style="background-image:var(--p3)"></i><i class="stack__knob"></i></button>
        <button class="stack__item pos-up2" type="button"><i class="stack__img" style="background-image:var(--p4)"></i><i class="stack__knob"></i></button>
        <button class="stack__item pos-up1" type="button"><i class="stack__img" style="background-image:var(--p5)"></i><i class="stack__knob"></i></button>
      </div>

      <!-- خانات الأغاني: من غير أي مستطيل حولها — كل أغنية أسطوانة زي الوقت والتاريخ، والخواص دي بتعمل نفسها
           من قايمة SONGS في السكربت (نفس لينكات المشغل) -->
      <div class="songs layer" id="songs"></div>

    </aside>

  </main>

  <!-- 6) الصورة الكبيرة: بتفتح من خانات المعرض، ومن الصورة الشخصية الكبيرة،
       ومن دايرة البروفايل فوق (دي بتفتح الكروت). قفلها: زرار × أوEsc أو ضغطة في الخلفية -->
  <div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="photo" aria-hidden="true">
    <div class="zoom__bg"></div>
    <div class="zoom__box raise">
      <i class="zoom__img"></i>
      <svg class="zoom__glyph" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#glyph-photo"/></svg>
    </div>
    <button class="zoom__btn zoom__btn--prev raise" type="button" aria-label="previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <button class="zoom__btn zoom__btn--next raise" type="button" aria-label="next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
    </button>
    <button class="zoom__btn zoom__btn--close raise" type="button" aria-label="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg>
    </button>
  </div>

  <canvas class="snow" aria-hidden="true"></canvas>
  </div>

  <script>
    const slides = [...document.querySelectorAll('#deck .stack__item')];
    /* المواقع حوالين الكارت المختار: اللي بعده ينزل تحته، واللي قبله يطلع فوقه — والكارت المختار دايمًا في النص */
    const POS = ['pos-mid', 'pos-dn1', 'pos-dn2', 'pos-up2', 'pos-up1'];

    function show(active){
      slides.forEach((s, n) => {
        const d = (n - active + slides.length) % slides.length;
        s.className = 'stack__item ' + POS[d];
      });
    }

    slides.forEach((s, n) => s.addEventListener('click', () => show(n)));

    /* الكروت بعجلة الماوس: لفّة لتحت تنزّل اللي تحت النص، ولفّة لفوق تطلّع اللي فوقه.
       لفّة واحدة كل مرة — عشان التاتش باد ما يلفّش الدكة كلها في ثانية */
    let wheelStamp = 0;
    document.getElementById('deck').addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - wheelStamp < 180) return;
      wheelStamp = now;
      const active = slides.findIndex((s) => s.classList.contains('pos-mid'));
      show((active + (e.deltaY > 0 ? 1 : -1) + slides.length) % slides.length);
    }, {passive:false});

    /* الدائرتين: الثيم يلف على 5 ألوان، والليلي يبدّل بين الداكن والأبيض */
    const root = document.documentElement;
    const colors = ['burgundy','lavender','mint','ink','paper'];

    document.querySelector('.dot--themes').addEventListener('click', () => {
      const next = (colors.indexOf(root.dataset.color) + 1) % colors.length;
      root.dataset.color = colors[next];
    });

    const night = document.querySelector('.dot--night');
    night.addEventListener('click', () => {
      root.dataset.mode = night.classList.toggle('is-on') ? 'night' : 'light';
    });

    /* ===== مشغل الصوت + الـ EQ في المستطيل اللي تحت الصورة ===== */
    /* حط لينك ملف الـ mp3 مكان الفارغ ده — سطر واحد
       الأعمدة بتتحرك مع الموسيقى بس على لينك بيرجّع إذن CORS في رأس
       Access-Control-Allow-Origin  (زي لينكات archive.org).
       اللينك اللي ما بيرجّعش الإذن ده بيتشغل عادي بس الأعمدة تفضل ثابتة. */
    /* قايمة الأغاني: خانة أسطوانية لكل أغنية — حط لينك الملف مكان الفارغ، وزرار قبل/بعد بيلفّوا عليها.
       عادي تحط اسم الأغنية زي ما يبان في الخانة بعد اللينك على نفس السطر، قبله مسافة وعلامة |
       مثال:  'https://…/song.mp3 | اسم الأغنية - اسم المغني'  — ومن غير الـ | الاسم بيتقرا من اسم الملف */
    const SONGS = [
      'https://serv100.albumaty.com/songs_2020/Albumaty.Com_hmzh_nmrh_alwkat_alakhyrt.mp3 | الوقعة الأخيرة - حمزه نمره',   /* الأغنية ١ */
      'https://serv100.albumaty.com/songs_2020/Albumaty.Com_hmzh_nmrh_fady_shwyt.mp3 | فاضي شوية - حمزه نمره',   /* الأغنية ٢ */
      'https://soundcloud.com/mostafa-fheel/khadiga-hegazy-ft-el-azraa-yehel-el-leil | خديجه حجازي و الأزرق - يهل الليل',   /* الأغنية ٣ */
      'https://serv100.albumaty.com/2024/Albumaty.Com_bhaa_sltan_ana_mn_ghyrk_-_mn_fylm_alhwi_sltan.mp3 | انا من غيرك - بهاء سلطان',   /* الأغنية ٤ */
      'https://serv100.albumaty.com/song2022/Albumaty.Com_ahmd_sad_kadr_akml.mp3 | قادر اكمل - احمد سعد',   /* الأغنية ٥ */
    ];

    /* اللينك لوحده (من غير الاسم اللي ورا الـ |) عشان منه يشتغل الصوت */
    const urlOf = (src) => src.split(' | ')[0].trim();
    /* الاسم المكتوب ورا الـ |، ولو محطوطش حاجة بيرجع فاضي */
    const titleOf = (src) => { const p = src.split(' | '); return p.length > 1 ? p.slice(1).join(' | ').trim() : ''; };

    const btn = document.querySelector('.lines__play');
    const bar = document.querySelector('.lines__bar');
    const fill = document.querySelector('.lines__fill');
    const knob = document.querySelector('.lines__knob');
    const tCur = document.querySelector('.lines__time .t-cur');
    const tTot = document.querySelector('.lines__time .t-tot');
    const eqBars = [...document.querySelector('.lines__wave').children];

    let ratio = 0;
    let index = 0;
    let song = null;
    /* المصدر اللي شغال دلوقتي: 'local' = ملف mp3 مباشر، و'sc' = أغنية ساوند كلاود */
    let mode = 'local';
    let ctx = null;
    let graphFor = null;
    let analyser = null;
    let bins = null;
    let binHz = 0;
    let rafId = 0;

    const fmt = (s) => { s = Math.max(0, Math.round(s) || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

    function paint(){
      const pct = (ratio * 100).toFixed(2) + '%';
      fill.style.width = pct;
      knob.style.left = pct;
      bar.setAttribute('aria-valuenow', Math.round(ratio * 100));
    }

    function seekTo(r){
      ratio = Math.min(1, Math.max(0, r));
      if (mode === 'sc') {
        scSeek();
        tCur.textContent = fmt(ratio * scDur / 1000);
      } else {
        if (song && song.duration) song.currentTime = ratio * song.duration;
        tCur.textContent = fmt(ratio * (song && song.duration ? song.duration : 0));
      }
      paint();
    }

    /* الـ EQ: بلف الأعمدة على الترددات لوغاريتمي — البس على الشمال والحواسيب على اليمين */
    function drawEq(){
      rafId = requestAnimationFrame(drawEq);
      analyser.getByteFrequencyData(bins);
      const top = Math.min(16000, ctx.sampleRate / 2);
      const loHz = Math.log2(60), hiHz = Math.log2(top);
      eqBars.forEach((el, i) => {
        const hz = 2 ** (loHz + ((i + .5) / eqBars.length) * (hiHz - loHz));
        const from = Math.max(1, Math.floor(hz / binHz));
        const to = Math.min(bins.length - 1, Math.max(from + 1, Math.ceil(hz / binHz)));
        let peak = 0;
        for (let b = from; b <= to; b++) peak = Math.max(peak, bins[b]);
        el.style.setProperty('--h', (6 + 94 * (peak / 255) ** .85).toFixed(1) + '%');
      });
    }

    function stopEq(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
    }

    /* يركّب الصوت على محلل الترددات — لجوا ضغطة عشان المتصفح مبيرضاش عن غير كده */
    function armEq(){
      if (!song || !song.crossOrigin || graphFor === song) return;
      try {
        if (!ctx) {
          ctx = new AudioContext();
          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = .82;
          bins = new Uint8Array(analyser.frequencyBinCount);
          binHz = ctx.sampleRate / analyser.fftSize;
          analyser.connect(ctx.destination);
        }
        ctx.createMediaElementSource(song).connect(analyser);
        graphFor = song;
      } catch (e) {
        ctx = null;
        graphFor = null;
      }
    }

    function setPlaying(on){
      btn.classList.toggle('is-playing', on);
      btn.setAttribute('aria-label', on ? 'pause' : 'play');
    }

    /* بيرجّع الأعمدة لشكلها الثابت */
    function clearEqBars(){
      eqBars.forEach(el => el.style.removeProperty('--h'));
    }

    function corsElement(src){
      const el = new Audio();
      el.crossOrigin = 'anonymous';
      el.preload = 'metadata';
      el.src = src;
      return el;
    }

    function wire(el){
      song = el;
      /* أي خبر من أغنية اتسابت لازم ميمسش حالة اللي شغالة دلوقتي */
      el.addEventListener('loadedmetadata', () => {
        if (el !== song) return;
        tTot.textContent = fmt(el.duration);
      });
      el.addEventListener('timeupdate', () => {
        if (el !== song || !el.duration) return;
        ratio = el.currentTime / el.duration;
        tCur.textContent = fmt(el.currentTime);
        paint();
      });
      el.addEventListener('ended', () => {
        if (el !== song) return;
        stop();
        ratio = 0;
        tCur.textContent = '0:00';
        paint();
      });
      /* اللينك ما بيرجّعش إذن → نرجع تشغيل عادي من غير الـ EQ بدل ما يقف */
      el.addEventListener('error', () => {
        if (el !== song || !el.crossOrigin) return;
        const plain = new Audio(urlOf(SONGS[index]));
        plain.preload = 'metadata';
        wire(plain);
      });
    }

    function start(){
      if (mode === 'sc') { scPlay(); return; }
      const el = song;
      if (!el) return;
      setPlaying(true);
      armEq();
      if (ctx) { ctx.resume(); drawEq(); }
      /* لو الأغنية اتبدلت قبل ما تبدأ، الرفض ده بيخص العنصر القديم — ميفيدش يوقف الجديدة */
      el.play().catch(() => { if (song === el) stop(); });
    }

    function stop(){
      if (mode === 'sc') { scPause(); setPlaying(false); return; }
      if (song) song.pause();
      stopEq();
      clearEqBars();
      setPlaying(false);
    }

    /* أغنية جديدة: بيطفّي المؤشر والأعمدة، ولو كانت شغالة بيكمّل على اللي بعدها */
    function load(i, keepPlaying){
      index = (i + SONGS.length) % SONGS.length;
      stop();
      const old = song;
      song = null;
      if (old) old.removeAttribute('src');
      ratio = 0;
      tCur.textContent = '0:00';
      tTot.textContent = '0:00';
      paint();
      const src = SONGS[index];
      syncPlaylist();
      if (isSC(src)) {
        /* لينك ساوند كلاود: مش ملف، فبيتحط في المشغل الرسمي بتاعهم المستخبي */
        mode = 'sc';
        scWant = !!keepPlaying;
        scMount(urlOf(src));
        if (keepPlaying) scPlay();
      } else {
        mode = 'local';
        scStop();
        if (src) {
          wire(corsElement(urlOf(src)));
          if (keepPlaying) start();
        }
      }
    }

    /* ===== أغاني ساوند كلاود ===== */
    /* لينك ساوند كلاود مفيش منه ملف mp3 مباشر، فالأغنية بتتحمل في المشغل الرسمي
       بتاعهم جوه الإطار المستخبي (.sc-frame) وبتحكم من هنا عن طريق الـ Widget API:
       نفس زرار التشغيل، نفس شريط التقدم، ونفس الوقتين — من غير أي واجهة باينة.
       الأعمدة بتاعت الـ EQ بتفضل ثابتة معاه لأن الصوت جوه إطار تاني محجول بالإذن.
       لو عايز تضيف أغنية من هناك: سطر جديد في SONGS باللينك بتاع الصفحة + الاسم ورا الـ | */
    const scFrame = document.getElementById('sc-frame');
    const isSC = (src) => /^https?:\/\/(www\.)?soundcloud\.com\//i.test(urlOf(src));
    let sc = null;
    let scWant = false;
    let scReady = false;
    let scDur = 0;
    /* الأغنية اللي جوه الإطار دلوقتي: لازم نعرفها عشان ما نرشّطش الإطار من وراها */
    let scUrl = null;
    /* نفس الإعدادات اللي بتتحط في عنوان الإطار، بتتبعها كل ما أغنية تتغير */
    const scOpts = () => ({ auto_play: false, hide_related: true, show_comments: false, show_user: false, show_reposts: false, visual: false });

    /* سكربت الـ API بيحمّل مرة واحدة بس، وأول ما يوصل المشغل بيتجهز */
    function scApiReady(cb){
      if (window.SC && window.SC.Widget) { cb(); return; }
      const s = document.createElement('script');
      s.src = 'https://w.soundcloud.com/player/api.js';
      s.onload = cb;
      s.onerror = () => s.remove();
      document.head.append(s);
    }

    function scBind(){
      sc.bind(window.SC.Widget.Events.READY, () => {
        scReady = true;
        sc.getDuration((ms) => { scDur = ms; if (mode === 'sc') tTot.textContent = fmt(ms / 1000); });
        if (scWant) sc.play();
      });
      /* أي خبر من الإطار ممكن يوصل متأخر — بعد ما نكون حولنا لأغنية mp3 —
         فكل خبر بيتمرر من هنا بيتقبل بس طول ما المصدر الشغال هو ساوند كلاود */
      sc.bind(window.SC.Widget.Events.PLAY, () => { if (mode === 'sc') setPlaying(true); });
      sc.bind(window.SC.Widget.Events.PAUSE, () => { if (mode === 'sc') setPlaying(false); });
      sc.bind(window.SC.Widget.Events.FINISH, () => {
        if (mode !== 'sc') return;
        setPlaying(false);
        ratio = 0;
        tCur.textContent = '0:00';
        paint();
      });
      /* الوقت الحالي والمدة بيوصلوا بالميلي ثانية.
         الحقول اسمها في النسخة الجديدة currentPosition و relativePosition،
         وفي القديمة current_time و total_time — الاتنين متقبلين هنا */
      sc.bind(window.SC.Widget.Events.PLAY_PROGRESS, (d) => {
        if (mode !== 'sc') return;
        const cur = d.currentPosition ?? d.current_time ?? 0;
        scDur = d.total_time || scDur || (d.relativePosition ? cur / d.relativePosition : 0);
        ratio = scDur ? Math.min(1, Math.max(0, cur / scDur)) : 0;
        tCur.textContent = fmt(cur / 1000);
        tTot.textContent = fmt(scDur / 1000);
        paint();
      });
    }

    function scMount(url){
      /* نفس الأغنية اللي جوّه الإطار أصلًا: سيب الإطار زي ما هو.
         إعادة نفس العنوان على الإطار مبتعملش تحميل جديد، فالرسايل بتاعت "جاهز"
         مش بتتقال تاني ولو عدّلنا الرايات كنا بنستنى استعداد مش هييجي أبدًا */
      if (sc && scUrl === url) {
        if (scReady && scDur) tTot.textContent = fmt(scDur / 1000);
        return;
      }
      scReady = false;
      scDur = 0;
      scUrl = url;
      /* أول مرة: العنوان بيتحط قبل ما النسخة تتبني — سكربت ساوند كلاود بيقرا
         عنوان الإطار مرة واحدة وهو بيتبني، ولو قراه فاضي بيرفض كل رسالة تيجي بعده.
         بعد كده أي أغنية تانية بتمرر عن طريق load بتاعهم: هو اللي بيغيّر
         العنوان ويستنى "جاهز" من جديد ويعايد تسجيل الأحداث على الصفحة الجديدة */
      if (sc) { sc.load(url, scOpts()); return; }
      scFrame.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&' +
        Object.entries(scOpts()).map(([k, v]) => k + '=' + v).join('&');
      scApiReady(() => {
        if (sc) return;
        sc = window.SC.Widget(scFrame);
        scBind();
      });
    }

    function scPlay(){ scWant = true; if (sc && scReady) sc.play(); }
    function scPause(){ scWant = false; if (sc && scReady) sc.pause(); }
    function scSeek(){ if (sc && scReady && scDur) sc.seekTo(Math.round(ratio * scDur)); }
    /* الأغنية بتقابل mp3: الوقف بس — الراية الجاهزة بتفضل صحّ لأن الإطار نفسه لسه شغال */
    function scStop(){ scWant = false; if (sc) sc.pause(); }

    /* ===== خانات الأغاني على اليمين ===== */
    /* كل أغنية بتعمل أسطوانة لوحدها زي خانة الوقت والتاريخ بالظبط — من غير أي مستطيل حولهم.
       عشان تزيد الخانات زوّد سطر في SONGS فوق. الاسم اللي بيبان في الخانة هو المكتوب
       ورا الـ | على نفس السطر، ولو محطوطش بيرجع بيتقرا من اسم الملف،
       ولو الخانة فاضية بيبقى "Song 1" ... لحد عدد السطور.
       الضغط على أي خانة بتشغل الأغنية دي في المشغل الكبير، واللي شغالة بتغور جوا. */
    const songsBox = document.getElementById('songs');

    function trackName(src, n){
      if (!src) return 'Song ' + (n + 1);
      const named = titleOf(src);
      if (named) return named;
      const file = urlOf(src).split(/[?#]/)[0].split('/').pop();
      let out = file;
      try { out = decodeURIComponent(file); } catch (err) {}
      return out.replace(/\.[a-z0-9]+$/i, '') || out;
    }

    SONGS.forEach((src, n) => {
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'track pill raise';
      const glyph = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      glyph.setAttribute('aria-hidden', 'true');
      glyph.innerHTML = '<use href="#ico-playlist" width="100%" height="100%"/>';
      const name = document.createElement('span');
      name.className = 'pill__text';
      name.textContent = trackName(src, n);
      cell.append(glyph, name);
      cell.addEventListener('click', () => load(n, true));
      songsBox.append(cell);
    });

    /* الخانة اللي اسمها أطول من عرضها بتخد كلاس is-long فالحركة بتاعت الاسم تشتغل عليها،
       والمقدار --shift = الفرق بين عرض الكتابة وعرض الخانة كنسبة من الخانة نفسها.
       القياس بيرجع يتعمل تاني بعد ما الخط يحمّل وبعد أي تغيير في مقاس الصفحة */
    function fitTracks(){
      [...songsBox.children].forEach((cell) => {
        const label = cell.querySelector('.pill__text');
        if (!label) return;
        cell.classList.add('is-long');
        const have = label.clientWidth;
        const over = label.scrollWidth - have;
        if (have > 2 && over > 1) {
          label.style.setProperty('--shift', '-' + ((over / have) * 100).toFixed(2) + '%');
        } else {
          cell.classList.remove('is-long');
          label.style.removeProperty('--shift');
        }
      });
    }
    fitTracks();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTracks);
    new ResizeObserver(fitTracks).observe(document.querySelector('.frame'));

    function syncPlaylist(){
      [...songsBox.children].forEach((cell, n) => cell.classList.toggle('is-active', n === index));
    }

    load(0, false);

    btn.addEventListener('click', () => {
      btn.classList.contains('is-playing') ? stop() : start();
    });

    /* زرارين تبديل الأغنية: الأولاني للقبلية والتاني للبعدية، وبيلفّوا على القائمة */
    [...document.querySelectorAll('.lines__step')].forEach((el, n) => {
      el.addEventListener('click', () => load(index + (n === 0 ? -1 : 1), btn.classList.contains('is-playing')));
    });

    /* المسطرة (الأعمدة): ضغطة تشغّل الأغنية وضغطة توقفها */
    document.querySelector('.lines__wave').addEventListener('click', () => {
      btn.classList.contains('is-playing') ? stop() : start();
    });

    bar.addEventListener('click', (e) => {
      const b = bar.getBoundingClientRect();
      seekTo((e.clientX - b.left) / b.width);
    });

    bar.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { seekTo(ratio + .05); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { seekTo(ratio - .05); e.preventDefault(); }
    });

    /* التنقل فوق: نفس الصفحة — اللي بيتغير هو الخانات اللي بتبان وبس */
    const navBtns = [...document.querySelector('.rail__grp').children];
    const VIEWS = ['home', 'gallery', 'friends'];
    /* الخانات اللي بتبان في كل صفحة — الكروت وقايمة الأغاني ثابتة في الصفحات الثلاثة،
       ومشغل الصوت مش موجود هنا لأنه دايماً ظاهر */
    const SHOW = {
      home: ['.media', '.stack', '.songs'],
      gallery: ['.gallery', '.stack', '.songs'],
      friends: ['.friends', '.stack', '.songs'],
    };
    const layers = [...document.querySelectorAll('.layer')];

    function setView(name){
      root.dataset.view = name;
      layers.forEach((el) => el.classList.toggle('is-hidden', !SHOW[name].some((s) => el.matches(s))));
    }

    /* الصفحة اللي فاتحة تتعلّم في زرارها في الشريط الشمال — من أي مكان جيت عليها */
    function goView(name){
      navBtns.forEach((x, n) => x.classList.toggle('is-active', VIEWS[n] === name));
      setView(name);
    }

    navBtns.forEach((b, i) => b.addEventListener('click', () => goView(VIEWS[i])));

    /* خانة Photo اللي تحت المود: نفس انتقال زرار الشريط، بس من مكانها */
    document.querySelector('.gallery-jump').addEventListener('click', () => goView('gallery'));

    /* ===== الصورة الكبيرة: نفس الصفحة، الخلفية بتغمق والصورة بتطلع في النص ===== */
    /* الصور دي هي نفسها المخزنة فوق في --p1..--p5، فأي صورة في الكروت أو المعرض بتبان كبيرة */
    const zoom = document.getElementById('zoom');
    const zoomImg = zoom.querySelector('.zoom__img');
    const PHOTOS = ['--p1', '--p2', '--p3', '--p4', '--p5'];
    let zoomAt = 0;

    const zoomNav = [zoom.querySelector('.zoom__btn--prev'), zoom.querySelector('.zoom__btn--next')];

    /* single = true بتقفل أسهم التقليب: الصورة اللي بتتفتح من البروفايل بتفضل وحدة */
    function openZoom(i, single){
      zoomAt = (i + PHOTOS.length) % PHOTOS.length;
      zoomImg.style.backgroundImage = 'var(' + PHOTOS[zoomAt] + ')';
      zoomNav.forEach((b) => { b.hidden = !!single; b.style.display = single ? 'none' : ''; });
      zoom.classList.add('is-open');
      zoom.setAttribute('aria-hidden', 'false');
    }

    function closeZoom(){
      zoom.classList.remove('is-open');
      zoom.setAttribute('aria-hidden', 'true');
    }

    /* خانات المعرض: كل خانة بتفتح صورتها هي، والأسهم بتقلب على الباقي */
    [...document.querySelectorAll('.tile')].forEach((t, n) => t.addEventListener('click', () => openZoom(n)));

    /* الصورة الكبيرة في الصفحة: صورة واحدة بس — من غير أسهم تقليب */
    document.querySelector('.media').addEventListener('click', () => openZoom(0, true));

    /* دايرة البروفايل فوق: هي كمان صورة واحدة بتفتحها، والكارت اللي في نص الكروت */
    document.querySelector('.topbar__avatar').addEventListener('click', () => {
      openZoom(slides.findIndex((s) => s.classList.contains('pos-mid')), true);
    });

    zoom.querySelector('.zoom__btn--prev').addEventListener('click', () => openZoom(zoomAt - 1));
    zoom.querySelector('.zoom__btn--next').addEventListener('click', () => openZoom(zoomAt + 1));
    zoom.querySelector('.zoom__btn--close').addEventListener('click', closeZoom);
    zoom.querySelector('.zoom__bg').addEventListener('click', closeZoom);

    /* زرار Esc بيقفل الصورة الكبيرة من أي مكان */
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });

    /* ===== الثلج: نقط بتنزل على طول فوق الإطارة، لونها بيتبدّل مع الصفحة ومع المود ===== */
    /* النقط بتتحفظ بأبعاد نسبة (0 → 1) عشان تكبّر وتصغّر مع الإطارة من غير ما تتغير */
    const SNOW_TINT = {
      night: { home: '#f6e7ea', gallery: '#e6e0f5', friends: '#dff1e9' },
      light: { home: '#8b7f86', gallery: '#7a7391', friends: '#6d8a80' },
    };
    const snow = document.querySelector('.snow');
    const sctx = snow.getContext('2d');
    const FLAKES = [];

    for (let n = 0; n < 90; n++) {
      FLAKES.push({
        x: Math.random(), y: Math.random(),
        r: .14 + Math.random() * .26,
        vy: .0008 + Math.random() * .0022,
        sway: .0004 + Math.random() * .0016,
        phase: Math.random() * Math.PI * 2,
        alpha: .3 + Math.random() * .6
      });
    }

    let snowW = 0, snowH = 0;

    /* المقاس الحقيقي بالبيكسل مضروباً في دقة الشاشة عشان النقط تفضل نضيفة */
    function sizeSnow(){
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      const box = snow.getBoundingClientRect();
      snowW = box.width;
      snowH = box.height;
      snow.width = Math.round(snowW * dpr);
      snow.height = Math.round(snowH * dpr);
      sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawSnow(){
      requestAnimationFrame(drawSnow);
      const mode = root.dataset.mode === 'light' ? 'light' : 'night';
      const view = SHOW[root.dataset.view] ? root.dataset.view : 'home';
      const cqw = snowW / 100;
      sctx.clearRect(0, 0, snowW, snowH);
      sctx.fillStyle = SNOW_TINT[mode][view];
      FLAKES.forEach((f) => {
        f.y += f.vy;
        f.phase += .02;
        f.x += Math.sin(f.phase) * f.sway;
        if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
        sctx.globalAlpha = f.alpha;
        sctx.beginPath();
        sctx.arc(f.x * snowW, f.y * snowH, f.r * cqw, 0, Math.PI * 2);
        sctx.fill();
      });
      sctx.globalAlpha = 1;
    }

    new ResizeObserver(sizeSnow).observe(document.querySelector('.frame'));
    sizeSnow();
    setView('home');
    drawSnow();

    /* الوقت والتاريخ الحقيقيين في الخانتين فوق: بيتحدثوا كل ثانية */
    const tTime = document.querySelector('.t-time');
    const tDate = document.querySelector('.t-date');
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const pad2 = (n) => String(n).padStart(2, '0');

    function tickClock(){
      const now = new Date();
      tTime.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
      tDate.textContent = DAYS[now.getDay()] + ', ' + pad2(now.getDate()) + ' ' + MONTHS[now.getMonth()];
    }

    tickClock();
    setInterval(tickClock, 1000);

    paint();
  </script>

</body>
</html>
